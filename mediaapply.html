<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Application - BlurMC</title>
  
  <!-- External CSS Link -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Form Styles */
    .form-container {
      width: 100%;
      max-width: 700px;
      margin: 40px auto 60px auto;
      padding: 35px;
      background: rgba(16, 16, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h2 {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .form-header h2 span {
      color: #e50914;
    }

    .form-header p {
      color: #a8a8a8;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #dddddd;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #e50914;
      background: rgba(255, 255, 255, 0.07);
    }

    .form-group select option {
      background-color: #121212;
      color: #fff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #e50914;
      border: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
      transition: background 0.3s, transform 0.2s;
    }

    .btn-submit:hover {
      background: #ff0f1a;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="logo">BLUR<span>MC</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#">Vote</a></li>
        <li><a href="#">Store</a></li>
        <li><a href="staffapply.html">Staff Apply</a></li>
        <li><a href="mediaapply.html" class="active">Media</a></li>
        <li><a href="#">Rules</a></li>
        <li><a href="#">Support</a></li>
      </ul>
    </nav>
    <div class="nav-buttons">
      <button class="btn-login">Login</button>
      <button class="btn-register">Register</button>
    </div>
  </header>

  <!-- Form Container -->
  <div class="form-container">
    <div class="form-header">
      <h2>MEDIA <span>APPLICATION</span></h2>
      <p>Apply for Content Creator / Media rank on BlurMC.</p>
    </div>

    <form id="mediaForm">
      
      <!-- Minecraft IGN -->
      <div class="form-group">
        <label for="media-ign"><i class="fa-solid fa-user"></i> Minecraft Username (IGN)</label>
        <input type="text" id="media-ign" placeholder="e.g. NotGamerKM" required>
      </div>

      <!-- Discord Tag -->
      <div class="form-group">
        <label for="media-discord"><i class="fa-brands fa-discord"></i> Discord Tag / Username</label>
        <input type="text" id="media-discord" placeholder="e.g. username#0000 or username" required>
      </div>

      <!-- Platform / Rank Applying For -->
      <div class="form-group">
        <label for="media-platform"><i class="fa-solid fa-video"></i> Platform</label>
        <select id="media-platform" required>
          <option value="" disabled selected>Select Main Platform</option>
          <option value="YouTube">YouTube</option>
          <option value="Twitch">Twitch</option>
          <option value="TikTok / Shorts">TikTok / Shorts Creator</option>
        </select>
      </div>

      <!-- Channel Link -->
      <div class="form-group">
        <label for="media-channel"><i class="fa-solid fa-link"></i> Channel Link</label>
        <input type="url" id="media-channel" placeholder="https://youtube.com/@yourchannel" required>
      </div>

      <!-- Subscriber Count -->
      <div class="form-group">
        <label for="media-subs"><i class="fa-solid fa-users"></i> Subscriber / Follower Count</label>
        <input type="text" id="media-subs" placeholder="e.g. 500, 1.2K" required>
      </div>

      <!-- Average Views -->
      <div class="form-group">
        <label for="media-views"><i class="fa-solid fa-eye"></i> Average Views Per Video / Stream</label>
        <input type="text" id="media-views" placeholder="e.g. 200-500 views" required>
      </div>

      <!-- Additional Info -->
      <div class="form-group">
        <label for="media-info"><i class="fa-solid fa-message"></i> Additional Information / Plans</label>
        <textarea id="media-info" placeholder="Tell us about your content plans for BlurMC..."></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Submit Application</button>

    </form>
  </div>

  <!-- JavaScript File Connected Here -->
  <script src="script.js"></script>
</body>
</html>
