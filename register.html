<!DOCTYPE html>
<html>
<head>
<title>BlurMC Register</title>

<style>
body{
background:#080808;
color:white;
font-family:Arial;
}
.box{
width:350px;
margin:100px auto;
background:#151515;
padding:25px;
border:2px solid red;
border-radius:15px;
}
h1{
color:red;
text-align:center;
}
input,button{
width:100%;
padding:12px;
margin-top:15px;
border-radius:8px;
}
input{
background:#222;
color:white;
border:1px solid red;
}
button{
background:red;
color:white;
border:none;
}
a{
color:red;
}
</style>

</head>

<body>

<div class="box">

<h1>BlurMC Register</h1>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>

<p>
Already have account?
<a href="login.html">Login</a>
</p>

</div>


<script>

function register(){

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;


if(username=="" || password==""){
alert("Fill all details");
return;
}


localStorage.setItem("BlurMC_User",username);
localStorage.setItem("BlurMC_Pass",password);


alert("Register Successful!");

window.location.href="login.html";

}

</script>

</body>
</html>
