<!DOCTYPE html>
<html>
<head>
<title>BlurMC Login</title>

<style>
body{
    background:#080808;
    color:white;
    font-family:Arial;
}

.box{
    width:350px;
    margin:100px auto;
    background:#151515;
    padding:25px;
    border:2px solid red;
    border-radius:15px;
}

h1{
    text-align:center;
    color:red;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#222;
    color:white;
    border:1px solid red;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:red;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h1>BlurMC Login</h1>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>


<script>

function login(){

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;


let savedUser = localStorage.getItem("BlurMC_User");
let savedPass = localStorage.getItem("BlurMC_Pass");


if(username === savedUser && password === savedPass){

alert("Login Successful! Welcome to BlurMC 🔥");

window.location.href="index.html";

}

else{

alert("Wrong Username or Password!");

}

}

</script>


</body>
</html>
