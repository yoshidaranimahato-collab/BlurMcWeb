<!DOCTYPE html>
<html>
<head>
<title>BlurMC Login</title>

<style>
body{
background:#080808;
color:white;
font-family:Arial;
}
.box{
width:350px;
margin:100px auto;
background:#151515;
padding:25px;
border:2px solid red;
border-radius:15px;
}
h1{
color:red;
text-align:center;
}
input,button{
width:100%;
padding:12px;
margin-top:15px;
border-radius:8px;
}
input{
background:#222;
color:white;
border:1px solid red;
}
button{
background:red;
color:white;
border:none;
}
a{
color:red;
}
</style>

</head>

<body>


<div class="box">

<h1>BlurMC Login</h1>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>
No account?
<a href="register.html">Register</a>
</p>

</div>



<script>

function login(){

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;


let user=localStorage.getItem("BlurMC_User");
let pass=localStorage.getItem("BlurMC_Pass");


if(username==user && password==pass){


localStorage.setItem("BlurMC_Login","true");


alert("Welcome "+username);


window.location.href="index.html";


}else{

alert("Wrong Username or Password");

}

}

</script>


</body>
</html>
