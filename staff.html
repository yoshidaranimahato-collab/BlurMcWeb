<!DOCTYPE html>
<html>
<head>
<title>BlurMC Staff Apply</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    background:#080808;
    color:white;
    font-family:Arial;
}

.container{
    max-width:700px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    color:red;
    text-shadow:0 0 15px red;
}

.box{
    background:#151515;
    border:2px solid red;
    border-radius:15px;
    padding:25px;
    margin-top:20px;
}

label{
    display:block;
    color:red;
    margin-top:15px;
}

input, textarea, select{
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#222;
    border:1px solid red;
    color:white;
    border-radius:8px;
}

textarea{
    height:120px;
}

button{
    margin-top:25px;
    width:100%;
    padding:15px;
    background:red;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.roles{
    color:#ff4444;
}
</style>

</head>

<body>

<div class="container">

<h1>BlurMC Staff Apply</h1>

<div class="box">

<h2>Available Staff Roles</h2>

<p class="roles">
🛡 Helper<br>
🔨 Moderator<br>
⚔ Senior Moderator<br>
👑 Admin<br>
💼 Manager
</p>

</div>


<div class="box">

<form>

<label>1. What is your Username?</label>
<input type="text" placeholder="Minecraft Username">


<label>2. What time can you give to our server?</label>
<input type="text" placeholder="Example: IST (India Standard Time)">


<label>3. Where do you live?</label>
<input type="text" placeholder="Your Location">


<label>4. What is your age? (Don't lie)</label>
<input type="number" placeholder="Age">


<label>5. Which country are you in?</label>
<input type="text" placeholder="Country">


<label>6. Why do you want to become a staff member of BlurMC?</label>
<textarea placeholder="Your answer"></textarea>


<label>7. Write 50 lines about yourself</label>
<textarea placeholder="About yourself"></textarea>


<label>8. Which server do you prefer to apply?</label>

<select>
<option>Practice</option>
<option>Lifesteal</option>
<option>Survival</option>
</select>


<label>9. Why should we choose you over other applications?</label>
<textarea placeholder="Your answer"></textarea>


<button type="submit">
Submit Application
</button>

</form>

</div>

</div>

</body>
</html>
