<!DOCTYPE html>
<html>
<head>
<title>BlurMC Staff Apply</title>

<style>
body{
    background:#080808;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px;
}

h1{
    text-align:center;
    color:red;
    text-shadow:0 0 15px red;
}

.box{
    background:#151515;
    border:2px solid red;
    border-radius:15px;
    padding:25px;
}

label{
    display:block;
    color:#ff3333;
    margin-top:15px;
}

input, textarea, select{
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#222;
    color:white;
    border:1px solid red;
    border-radius:8px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:red;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff4444;
}
</style>

</head>

<body>

<div class="container">

<h1>BlurMC Staff Apply</h1>

<div class="box">

<form id="staffForm">

<label>1. What is your Username?</label>
<input id="username" required>

<label>2. What time you can give to our server? (IST)</label>
<input id="time" required>

<label>3. Where you live?</label>
<input id="live" required>

<label>4. What is your age? (Don't lie)</label>
<input id="age" required>

<label>5. Which country are you in?</label>
<input id="country" required>

<label>6. Why you want to become a staff member of BlurMC?</label>
<textarea id="reason" required></textarea>

<label>7. Write 50 lines about yourself</label>
<textarea id="about" required></textarea>

<label>8. Which server you prefer to apply?</label>
<select id="server">
<option>Practice</option>
<option>Lifesteal</option>
<option>Survival</option>
</select>

<label>9. Why we choose you on other applications?</label>
<textarea id="choose" required></textarea>


<button type="submit">
Submit Application
</button>

</form>

</div>

</div>


<script>

const webhookURL = "https://discord.com/api/webhooks/1532333312087949342/Ao0dt46uZcigAOp1JNYWT6aV63BGFS-PT1rtuKav9MJyC_d5AM4KfPozz5Lx47Xpb-86";


document.getElementById("staffForm").addEventListener("submit", function(e){

e.preventDefault();


let message = {

embeds:[{

title:"📝 New BlurMC Staff Application",

color:16711680,

fields:[

{name:"Username",value:username.value},
{name:"Time",value:time.value},
{name:"Live",value:live.value},
{name:"Age",value:age.value},
{name:"Country",value:country.value},
{name:"Reason",value:reason.value},
{name:"About",value:about.value},
{name:"Server",value:server.value},
{name:"Why Choose",value:choose.value}

]

}]

};


fetch(webhookURL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(message)

});


alert("Your Staff Apply is submitted successfully!");

});


</script>


</body>
</html>
