<!DOCTYPE html>
<html>
<head>
<title>BlurMc | Media Apply</title>

<style>

body{
background:#000;
color:white;
font-family:Arial, sans-serif;
}

.box{
width:90%;
max-width:500px;
margin:50px auto;
background:#080808;
padding:30px;
border-radius:15px;
border:2px solid red;
box-shadow:0 0 25px red;
}

h1{
text-align:center;
color:red;
text-shadow:0 0 15px red;
}

p{
text-align:center;
color:#aaa;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
background:#111;
color:white;
border:1px solid red;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:red;
color:white;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
box-shadow:0 0 15px red;
}

button:hover{
box-shadow:0 0 35px red;
}

</style>

</head>

<body>

<div class="box">

<h1>🔥 Media Rank Apply</h1>

<p>Apply for Media Rank on BlurMC Network</p>


<form>

<input type="text" placeholder="Minecraft IGN" required>

<input type="text" placeholder="Discord Username" required>

<input type="url" placeholder="Your YouTube Channel Link" required>

<input type="number" placeholder="YouTube Subscribers" required>

<textarea rows="5" placeholder="Why should we give you Media Rank?"></textarea>

<button>
Submit Application
</button>

</form>

</div>

</body>
</html>
