<!DOCTYPE html>
<html>
<head>

<title>Media Rank Apply | BlurMC</title>

<style>

body{
background:#000;
color:white;
font-family:Arial;
}

.box{
width:90%;
max-width:500px;
margin:40px auto;
background:#080808;
padding:30px;
border-radius:15px;
border:2px solid red;
box-shadow:0 0 25px red;
}

h1{
text-align:center;
color:red;
text-shadow:0 0 15px red;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
background:#111;
color:white;
border:1px solid red;
border-radius:8px;
}


button{
width:100%;
padding:12px;
background:red;
color:white;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
box-shadow:0 0 15px red;
}


#success{
display:none;
margin-top:20px;
padding:15px;
background:#00aa44;
border-radius:10px;
text-align:center;
box-shadow:0 0 15px #00ff66;
}


</style>

</head>


<body>


<div class="box">

<h1>🔥 Media Rank Apply</h1>


<form id="applyForm">


<input id="ign" placeholder="Minecraft IGN" required>

<input id="discord" placeholder="Discord Username" required>

<input id="youtube" placeholder="YouTube Channel Link" required>

<input id="subs" type="number" placeholder="YouTube Subscribers" required>

<textarea id="reason" placeholder="Why should we give you Media Rank?" required></textarea>


<button type="submit">
Submit Application
</button>


</form>


<div id="success">
✅ Your application is submitted successfully!
</div>


</div>


<script>


const webhook = "https://discord.com/api/webhooks/1532333312087949342/Ao0dt46uZcigAOp1JNYWT6aV63BGFS-PT1rtuKav9MJyC_d5AM4KfPozz5Lx47Xpb-86";


document.getElementById("applyForm").addEventListener("submit", function(e){

e.preventDefault();


let data = {

content:"🔥 **New Media Rank Application**",

embeds:[{

title:"Media Apply",

color:16711680,

fields:[

{
name:"Minecraft IGN",
value:document.getElementById("ign").value
},

{
name:"Discord",
value:document.getElementById("discord").value
},

{
name:"YouTube",
value:document.getElementById("youtube").value
},

{
name:"Subscribers",
value:document.getElementById("subs").value
},

{
name:"Reason",
value:document.getElementById("reason").value
}

],

footer:{
text:"BlurMC Media System"
}

}]

};


fetch(webhook,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});


document.getElementById("success").style.display="block";

this.reset();


});


</script>


</body>
</html>
