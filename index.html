<button id="themeBtn">🌙</button>

<style>

#themeBtn{
    position:fixed;
    right:20px;
    top:20px;
    font-size:25px;
    background:#222;
    color:white;
    border:none;
    border-radius:50%;
    width:50px;
    height:50px;
    cursor:pointer;
    z-index:999;
}


.light-mode{
    background:white !important;
    color:black !important;
}


.light-mode .menu,
.light-mode .card,
.light-mode .status-box,
.light-mode .box{
    background:white !important;
    color:black !important;
}


.light-mode a{
    color:black !important;
}


</style>


<script>

let btn = document.getElementById("themeBtn");


btn.onclick = function(){

document.documentElement.classList.toggle("light-mode");


if(document.documentElement.classList.contains("light-mode")){

btn.innerHTML="☀️";

}else{

btn.innerHTML="🌙";

}

}

</script>

</script>

<header>

}

    color:red;
    font-size:30px;
    font-weight:bold;
}

</style>


<script>

function updateTime(){

let now = new Date();

let time = now.toLocaleTimeString();

document.getElementById("realTime").innerHTML = time;

}

setInterval(updateTime,1000);

updateTime();

</script>

  <script>

let auth=document.getElementById("authButtons");

let user=localStorage.getItem("BlurMC_User");
let login=localStorage.getItem("BlurMC_Login");


if(login=="true"){

auth.innerHTML=`
<span style="color:red;">${user}</span>
<a href="#" onclick="logout()">Logout</a>
`;

}else{

auth.innerHTML=`
<a href="login.html">Login</a>
<a href="register.html">Register</a>
`;

}


function logout(){

localStorage.removeItem("BlurMC_Login");

location.reload();

}

  </script>
